name: Verify Pitot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pitot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Show toolchain
        run: go version
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
      - name: Verify native Windows capture source boundaries
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p test_capture_source.py
          python scripts/pitot_adapter_supervisor.py check
      - name: Test module (isolated)
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Check runtime concurrency
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race ./runtime
      - name: Check startup readiness concurrency
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race ./cmd/pitot -run '^TestRuntimeReadiness'
      - name: Build reference executable
        env:
          GOWORK: "off"
        run: go build ./...

  wind-tunnel:
    name: Wind tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Integrated sensor and bridge check
        run: go test -tags windtunnel ./windtunnel/

  import-boundary:
    name: Sensor-innocence boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Enforce sensor does not import bridge
        run: bash scripts/check_import_boundary.sh

  maintenance:
    name: Maintenance tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-setup
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked maintenance tools
        run: npm ci --ignore-scripts
      - name: Install pinned Python checks
        run: python -m pip install -r requirements-format.txt -r requirements-wire.txt
      - name: Check generated SDK stability
        run: npm run generate:check
      - name: Check authored-source correctness
        run: npm run check:static
      - name: Verify generated Python SDK syntax
        run: python -m py_compile sdk/python/pitot/types.py
      - name: Supervise adapter verification boundary
        run: python scripts/pitot_adapter_supervisor.py check
      - name: Verify maintenance and public surface
        run: python -m unittest discover -s tests -p 'test_*.py'

  sdk-conformance:
    name: SDK cross-language conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust SDK builds and tests in isolation
        run: cargo test --manifest-path sdk/rust/Cargo.toml
      - name: Cross-language runner conformance (Python, TypeScript, Go, Rust)
        env:
          GOWORK: "off"
        run: >-
          python -m unittest discover
          -s sdk/tests -p 'test_*.py' -v
