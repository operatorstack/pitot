name: Pitot E2E reusable agent check

on:
  workflow_call:
    inputs:
      agent:
        description: Supported Pitot coding-agent host
        required: true
        type: string
      platform:
        description: Canonical Pitot platform identifier
        required: true
        type: string
      runner:
        description: GitHub-hosted runner selected by the supervisor
        required: true
        type: string
      capture:
        description: Emit a redacted binary-observed candidate fixture
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.agent }} (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify Cursor native Windows shell
        if: inputs.agent == 'cursor' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "Cursor native Windows hooks require PowerShell 7"
          }
          $PSVersionTable.PSVersion.ToString()
      - name: Resolve Bash runtime
        shell: bash
        run: |
          bash_path="$(command -v bash)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bash_path="$(cygpath -m "$bash_path")"
          fi
          echo "PITOT_BASH=$bash_path" >> "$GITHUB_ENV"
      - name: Install and attest pinned real agent
        timeout-minutes: ${{ inputs.agent == 'deepseek' && 10 || 5 }}
        shell: bash
        run: >-
          python3 tests/install_real_agent.py
          --agent "${{ inputs.agent }}"
          --platform "${{ inputs.platform }}"
          --output "${{ runner.temp }}/pitot-e2e/install.json"
      - name: Run ${{ inputs.agent }} E2E
        id: e2e
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          PITOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PITOT_E2E_PLATFORM: ${{ inputs.platform }}
          PITOT_INSTALL_RECEIPT: ${{ runner.temp }}/pitot-e2e/install.json
          PITOT_E2E_EVIDENCE: ${{ runner.temp }}/pitot-e2e/evidence.json
          PITOT_CAPTURE_OUTPUT: ${{ inputs.capture && format('{0}/pitot-e2e/capture.json', runner.temp) || '' }}
          PITOT_CAPTURE_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: >-
          python tests/run_e2e_report.py
          --agent "${{ inputs.agent }}"
          --platform "${{ inputs.platform }}"
          --output "${{ runner.temp }}/pitot-e2e/result.json"
          --evidence "${{ runner.temp }}/pitot-e2e/evidence.json"
          -- "$PITOT_BASH" "tests/e2e_${{ inputs.agent }}_cli_test.sh"
          < /dev/null
      - name: Upload structured E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitot-e2e-${{ inputs.agent }}-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/pitot-e2e/result.json
            ${{ runner.temp }}/pitot-e2e/deepseek-native-session.zstd
          if-no-files-found: error
          retention-days: 14
      - name: Upload safe installation diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitot-install-probe-${{ inputs.agent }}-${{ inputs.platform }}
          path: ${{ runner.temp }}/pitot-e2e/install.probe.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload endpoint provenance candidate
        if: always() && inputs.capture
        uses: actions/upload-artifact@v4
        with:
          name: pitot-endpoint-capture-${{ inputs.agent }}-${{ inputs.platform }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: |
            ${{ runner.temp }}/pitot-e2e/capture.json
            ${{ runner.temp }}/pitot-e2e/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce E2E result
        if: always() && steps.e2e.outcome != 'success'
        shell: bash
        run: exit 1
