# Builds prebuilt binaries and bindings from this repository and publishes
# to Artifact Registry. Repository variables configure the existing release target.
name: release-pitot

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no keys
  attestations: write # build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Validate release tag and source versions
        run: python scripts/check_release.py
      - uses: dtolnay/rust-toolchain@stable

      # goreleaser's `sboms` block shells out to syft; install it so the SBOM step succeeds.
      - name: install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: build binaries + checksums + SBOM
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # goreleaser's changelog (use: github) calls the compare API even when the GitHub
          # release is disabled; without a token it 401s. contents:read is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify SDK artifacts before publication
        run: python scripts/check_sdk_packages.py --output release-packages

      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/pitot_*.tar.gz, dist/pitot_*.zip, dist/checksums.txt, release-packages/*"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: publish binaries -> Artifact Registry (generic)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"   # strip the leading v; goreleaser archives are named without it
          for f in dist/pitot_*.tar.gz dist/pitot_*.zip dist/checksums.txt; do
            [ -e "$f" ] || continue
            gcloud artifacts generic upload \
              --project="${{ vars.AR_PROJECT }}" --location="${{ vars.AR_LOCATION }}" \
              --repository="${{ vars.AR_GENERIC_REPO }}" \
              --package=pitot --version="${VER}" --source="$f"
          done

      # "latest" is resolved by the get-service from the AR version list — no channel manifest
      # (AR rejects non-semver version ids like "latest").

      - name: publish verified npm binding (@operatorstack/pitot)
        working-directory: release-packages
        run: |
          set -euo pipefail
          gcloud artifacts print-settings npm \
            --project="${{ vars.AR_PROJECT }}" --location="${{ vars.AR_LOCATION }}" \
            --repository="${{ vars.AR_NPM_REPO }}" --scope=@operatorstack > .npmrc
          npx -y google-artifactregistry-auth --repo-config="$PWD/.npmrc" --credential-config="$PWD/.npmrc"
          npm publish ./operatorstack-pitot-*.tgz --ignore-scripts --userconfig="$PWD/.npmrc" \
            --registry="https://${{ vars.AR_LOCATION }}-npm.pkg.dev/${{ vars.AR_PROJECT }}/${{ vars.AR_NPM_REPO }}/"

      - name: publish verified python binding (operatorstack-pitot)
        run: |
          set -euo pipefail
          python -m pip install --quiet twine keyrings.google-artifactregistry-auth
          python -m twine upload \
            --repository-url "https://${{ vars.AR_LOCATION }}-python.pkg.dev/${{ vars.AR_PROJECT }}/${{ vars.AR_PYTHON_REPO }}/" \
            release-packages/*.whl release-packages/*.tar.gz
